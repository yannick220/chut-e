<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>chut.e !</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink:#080808;
  --muted:#777;
  --soft:#e3e3e3;
  --soft2:#d9d9d9;
  --paper:#fff;
  --reader-bg:#e6e6e6;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#fff; color:var(--ink); }
body {
  font-family:"Montserrat",Arial,sans-serif;
  overscroll-behavior:none;
}
button { font:inherit; color:inherit; }
svg { display:block; width:100%; height:100%; fill:currentColor; }

.app {
  width:100%;
  height:100dvh;
  max-width:430px;
  margin:0 auto;
  position:relative;
  overflow:hidden;
  background:#fff;
}

.brand {
  position:fixed;
  top:max(80px, calc(env(safe-area-inset-top) + 60px));
  left:25px;
  z-index:20;
  font-size:34px;
  line-height:1;
  font-weight:800;
  letter-spacing:-1.8px;
  user-select:none;
  cursor:default;
}

.shuffle-btn {
  position:absolute;
  right:84px;
  top:max(78px, calc(env(safe-area-inset-top) + 58px));
  width:56px;
  height:56px;
  border:0;
  border-radius:50%;
  background:#e2e2e2;
  padding:15px;
  z-index:20;
  cursor:pointer;
}
.shuffle-btn:active { transform:scale(.94); }

.deck {
  position:absolute;
  left:0;
  right:0;
  top:144px;
  bottom:150px;
  display:flex;
  align-items:center;
  justify-content:center;
  touch-action:none;
}

.stack-card {
  position:absolute;
  width:260px;
  height:470px;
  border-radius:33px;
  background:#dedede;
  transition:transform .42s cubic-bezier(.22,.8,.2,1), opacity .32s ease;
  transform-origin:center center;
}
.stack-card.back-left {
  transform:translate(-25px, 7px) rotate(-8deg);
}
.stack-card.back-right {
  transform:translate(25px, 28px) rotate(7deg);
  background:#d7d7d7;
}

.story-card {
  position:absolute;
  width:260px;
  height:448px;
  border-radius:31px;
  background:#fff;
  box-shadow:0 1px 0 rgba(0,0,0,.02);
  z-index:5;
  overflow:hidden;
  touch-action:none;
  will-change:transform,opacity;
  transition:transform .38s cubic-bezier(.2,.82,.2,1), opacity .28s ease;
}
.story-card.dragging { transition:none; }

.card-content {
  height:100%;
  padding:51px 31px 31px;
  display:flex;
  flex-direction:column;
}
.card-title {
  font-size:31px;
  line-height:1.03;
  letter-spacing:-1.3px;
  font-weight:800;
  margin:0 0 25px;
}
.preview {
  font-size:17px;
  line-height:1.08;
  letter-spacing:-.35px;
  white-space:pre-line;
  overflow:hidden;
  display:-webkit-box;
  -webkit-line-clamp:10;
  -webkit-box-orient:vertical;
}
.read-more {
  margin-top:8px;
  display:inline;
  width:max-content;
  border:0;
  background:transparent;
  padding:0;
  font-weight:800;
  font-size:14px;
  cursor:pointer;
}
.card-meta {
  margin-top:auto;
  padding-top:26px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  font-weight:700;
  letter-spacing:.35px;
}
.card-meta span { display:flex; align-items:center; gap:7px; }
.meta-icon { width:18px; height:18px; display:none; }

.save-cue {
  position:absolute;
  left:50%;
  top:22px;
  transform:translateX(-50%) translateY(-6px);
  border-radius:999px;
  padding:9px 14px;
  background:rgba(0,0,0,.82);
  color:#fff;
  font-size:12px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  z-index:12;
}
.nav-cue {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:12px;
  font-weight:800;
  letter-spacing:.2px;
  opacity:0;
  z-index:12;
  pointer-events:none;
}
.nav-cue.left { left:14px; }
.nav-cue.right { right:14px; }

.library-dock {
  transition:none !important;
  position:absolute;
  left:41px;
  right:41px;
  bottom:max(35px, calc(env(safe-area-inset-bottom) + 19px));
  height:70px;
  border-radius:36px;
  background:#dedede;
  padding:10px 12px 10px 16px;
  z-index:20;
  display:flex;
  align-items:center;
}
.library-main {
  flex:1;
  height:49px;
  background:#fff;
  border:0;
  border-radius:28px;
  display:grid;
  grid-template-columns:34px 1fr;
  align-items:center;
  gap:12px;
  padding:0 15px;
  cursor:pointer;
  text-align:left;
}
.library-main .lib-icon {
  width:32px;
  height:32px;
  overflow:hidden;
  flex:0 0 auto;
}

.library-copy{
  display:flex;
  align-items:center;
  min-width:0;
}
.library-copy strong{
  font-size:15px;
  line-height:1;
  font-weight:600;
  letter-spacing:-.2px;
}


.library-count {
  width:48px;
  height:48px;
  flex:0 0 48px;
  border-radius:50%;
  display:grid;
  place-items:center;
  margin-left:12px;
  background:#000;
  color:#fff;
  font-size:20px;
}

.reader-overlay {
  position:fixed;
  inset:0;
  z-index:100;
  background:transparent;
  visibility:hidden;
  pointer-events:none;
}
.reader-overlay.open {
  visibility:visible;
  pointer-events:auto;
}
.reader-backdrop {
  position:absolute;
  inset:0;
  background:var(--reader-bg);
  opacity:0;
  transition:opacity .34s ease;
}
.reader-overlay.open .reader-backdrop { opacity:1; }

.reader-brand {
  display:none !important;
  position:absolute;
  top:max(85px, calc(env(safe-area-inset-top) + 66px));
  left:max(25px, calc((100vw - 430px)/2 + 25px));
  z-index:104;
  font-size:34px;
  line-height:1;
  font-weight:800;
  letter-spacing:-1.8px;
  opacity:0;
  transition:opacity .25s ease .12s;
  user-select:none;
}
.reader-overlay.open .reader-brand {
  display:none !important; opacity:1; }

.reader-sheet {
  position:absolute;
  left:50%;
  bottom:0;
  width:min(100%,430px);
  transform:translateX(-50%);
  height:calc(100dvh - 136px);
  background:#fff;
  border-radius:30px 30px 0 0;
  overflow:hidden;
  opacity:0;
  transition:transform .36s cubic-bezier(.2,.82,.2,1),opacity .24s ease;
  transform-origin:center bottom;
  z-index:102;
}
.reader-overlay.open .reader-sheet {
  opacity:1;
}

.reader-scroll {
  position:absolute;
  inset:0;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  padding:66px 40px 128px;
}
.reader-scroll::-webkit-scrollbar { display:none; }

.reader-scroll h2 {
  margin:0 0 40px;
  font-size:31px;
  line-height:1.03;
  letter-spacing:-1.2px;
  font-weight:800;
}
.reader-scroll p {
  margin:0 0 10px;
  font-size:18px;
  line-height:1.06;
  letter-spacing:-.32px;
}

.reader-fade-top,.reader-fade-bottom {
  position:absolute;
  left:0; right:0;
  pointer-events:none;
  z-index:4;
}
.reader-fade-top {
  top:0; height:34px;
  background:linear-gradient(to bottom,#fff 0%,rgba(255,255,255,.74) 45%,rgba(255,255,255,0) 100%);
}
.reader-fade-bottom {
  bottom:0; height:55px;
  background:linear-gradient(to top,#fff 0%,rgba(255,255,255,.82) 45%,rgba(255,255,255,0) 100%);
}

.reader-actions {
  position:fixed;
  right:max(22px, calc((100vw - 430px)/2 + 22px));
  top:calc(100dvh - 234px);
  z-index:106;
  display:flex;
  flex-direction:column;
  gap:18px;
  opacity:0;
  transform:translateY(10px);
  transition:opacity .2s ease .16s, transform .2s ease .16s;
}
.reader-overlay.open .reader-actions {
  opacity:1;
  transform:translateY(0);
}
.float-action {
  width:56px;height:56px;border:0;border-radius:50%;
  background:#e1e1e1;
  padding:13px;
  cursor:pointer;
}
.float-action.liked {
  background:#111;
  color:#fff;
}
.float-action:active { transform:scale(.94); }

.modal {
  position:fixed;
  inset:0;
  z-index:200;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  background:rgba(0,0,0,.22);
  visibility:hidden;
  opacity:0;
  transition:opacity .22s ease;
}
.modal.open { visibility:visible; opacity:1; }
.modal-panel {
  width:min(100%,430px);
  max-height:78dvh;
  background:#fff;
  border-radius:30px 30px 0 0;
  padding:28px 24px max(32px,env(safe-area-inset-bottom));
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(.2,.82,.2,1);
  overflow:auto;
}
.modal.open .modal-panel { transform:translateY(0); }
.modal-head {
  display:flex; align-items:center; justify-content:space-between; margin-bottom:22px;
}
.modal-head h2 { margin:0; font-size:26px; letter-spacing:-1px; }
.close-btn {
  border:0; background:#e6e6e6; width:42px;height:42px;border-radius:50%;font-size:25px;line-height:1;
}
.library-list { display:flex;flex-direction:column;gap:10px; }
.lib-row {
  border:0;
  background:#f1f1f1;
  border-radius:20px;
  padding:17px 18px;
  text-align:left;
}
.lib-row strong { display:block; font-size:17px; margin-bottom:4px; }
.lib-row small { color:#777; font-size:13px; }
.empty { padding:40px 18px; text-align:center; color:#777; line-height:1.4; }

.comment-box {
  width:100%; min-height:110px; resize:none;
  border:1px solid #ddd; border-radius:18px; padding:14px;
  font:inherit; font-size:16px; outline:none;
}
.primary {
  width:100%; height:48px; border:0; border-radius:24px; margin-top:12px;
  background:#000;color:#fff;font-weight:700;
}

.admin-panel p { color:#666; font-size:14px; line-height:1.45; }
.admin-actions { display:grid; gap:10px; margin-top:18px; }
.admin-actions button {
  height:50px;border:0;border-radius:18px;background:#eee;font-weight:700;text-align:left;padding:0 18px;
}

.toast {
  position:fixed;
  z-index:300;
  left:50%;
  bottom:128px;
  transform:translateX(-50%) translateY(12px);
  background:#000;
  color:#fff;
  border-radius:999px;
  padding:10px 15px;
  font-size:12px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:opacity .2s ease,transform .2s ease;
}
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

@media (max-height:700px) {
  .brand { top:45px; }
  .shuffle-btn { top:42px; }
  .deck { top:106px; bottom:90px; }
  .story-card { height:430px; }
  .stack-card { height:452px; }
  .library-dock {
  transition:none !important; bottom:14px; }
}

/* ===== V5 : une seule carte, un seul titre, un seul texte ===== */

.brand{
  z-index:260 !important;
  pointer-events:auto !important;
  touch-action:manipulation;
}

.story-card{
  transform-origin:center center;
  overflow:hidden;
}

.story-card.expanding,
.story-card.expanded,
.story-card.collapsing{
  position:fixed !important;
  margin:0 !important;
  z-index:1 !important;
  box-shadow:none;
  touch-action:auto;
}

.story-card.expanded{
  border-radius:30px 30px 0 0;
}

/* Un seul contenu, utilisé dans les deux états. */
.story-scroll-single{
  position:absolute;
  inset:0;
  padding:51px 31px 72px;
  overflow:hidden;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.story-scroll-single::-webkit-scrollbar{display:none}

.story-card.expanded .story-scroll-single{
  overflow-y:auto;
  padding:51px 31px 128px;
  touch-action:pan-y;
}

.story-title-single{
  margin:0 0 25px;
  font-size:31px;
  line-height:1.03;
  letter-spacing:-1.3px;
  font-weight:800;
}

/* EXACTEMENT la même taille en aperçu et en lecture. */
.story-body-single{
  font-size:16.5px;
  line-height:1.12;
  letter-spacing:-.24px;
}

.story-body-single p{
  margin:0 0 10px;
}

.story-card:not(.expanded) .story-body-single{
  max-height:248px;
  overflow:hidden;
}

.read-more-single{
  position:absolute;
  left:31px;
  bottom:58px;
  border:0;
  background:transparent;
  padding:0;
  font-weight:800;
  font-size:14px;
  z-index:8;
  cursor:pointer;
}

.story-card.expanded .read-more-single{
  display:none;
}

.card-meta-single{
  position:absolute;
  left:31px;
  right:31px;
  bottom:27px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:12px;
  font-weight:700;
  letter-spacing:.2px;
  z-index:9;
}

.story-card.expanded .card-meta-single{
  display:none;
}

/* Fondu de l'aperçu. */
.compact-fade{
  position:absolute;
  left:0;
  right:0;
  bottom:42px;
  height:168px;
  pointer-events:none;
  z-index:6;
  background:linear-gradient(
    to top,
    rgba(255,255,255,1) 0%,
    rgba(255,255,255,.82) 30%,
    rgba(255,255,255,.25) 72%,
    rgba(255,255,255,0) 100%
  );
}
.story-card.expanded .compact-fade{
  display:none;
}

/* Fondu supérieur et inférieur de lecture plus ample. */
.expanded-fade-top,
.expanded-fade-bottom{
  display:none;
  position:absolute;
  left:0;
  right:0;
  pointer-events:none;
  z-index:12;
}
.story-card.expanded .expanded-fade-top,
.story-card.expanded .expanded-fade-bottom{
  display:block;
}
.expanded-fade-top{
  top:0;
  height:96px;
  background:linear-gradient(
    to bottom,
    rgba(255,255,255,1) 0%,
    rgba(255,255,255,.92) 14%,
    rgba(255,255,255,.64) 34%,
    rgba(255,255,255,.28) 56%,
    rgba(255,255,255,0) 100%
  );
}
.expanded-fade-bottom{
  bottom:0;
  height:68px;
  background:linear-gradient(
    to top,
    rgba(255,255,255,1) 0%,
    rgba(255,255,255,.82) 35%,
    rgba(255,255,255,.22) 74%,
    rgba(255,255,255,0) 100%
  );
}

/* Ancien reader-sheet définitivement désactivé : aucune seconde carte. */
.reader-sheet{ display:none !important; }

.reader-overlay{
  z-index:200;
}

.reader-backdrop{
  z-index:0;
  opacity:0;
  transition:opacity .34s ease;
}

/* Boutons visibles et plus espacés. */
.reader-actions{
  z-index:3 !important;
  gap:26px !important;
  top:220px !important;
  opacity:0;
  pointer-events:none;
}
.reader-overlay.open .reader-actions{
  opacity:1 !important;
  pointer-events:auto;
  transform:translateY(0) !important;
  transition:opacity .24s ease .12s, transform .24s ease .12s;
}

/* La fiche démarre plus bas qu'en V4 : plus d'air sous chut.e ! */
.preview{
  font-size:16.5px !important;
  line-height:1.12 !important;
}

/* Cartes arrière légèrement différenciées. */
.stack-card.back-left{
  background:#e7e7e7 !important;
}
.stack-card.back-right{
  background:#d7d7d7 !important;
}


/* V5.2 refinements */
.read-more-single,
.card-meta-single,
.compact-fade {
  transition: opacity .20s ease;
}

.shuffle-btn {
  transition: opacity .24s ease;
}

.story-card.expanding .read-more-single,
.story-card.expanded .read-more-single,
.story-card.collapsing .read-more-single,
.story-card.expanding .card-meta-single,
.story-card.expanded .card-meta-single,
.story-card.collapsing .card-meta-single,
.story-card.expanding .compact-fade,
.story-card.expanded .compact-fade,
.story-card.collapsing .compact-fade {
  opacity:0;
  pointer-events:none;
}

.app.reading .shuffle-btn {
  opacity:0;
  pointer-events:none;
}

/* Progression de lecture */
.read-progress-track{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:3px;
  background:rgba(0,0,0,.08);
  z-index:18;
  opacity:0;
  transition:opacity .2s ease;
}
.story-card.expanded .read-progress-track{
  opacity:1;
}
.read-progress-bar{
  width:0%;
  height:100%;
  background:#000;
  transform-origin:left center;
  transition:width .08s linear;
}


/* V5.3 — éléments d'accueil immobiles, simplement recouverts par la carte */
.app.reading .library-dock{
  opacity:1 !important;
  transform:none !important;
  pointer-events:auto;
}
.app.reading .shuffle-btn{
  opacity:0 !important;
  transform:none !important;
  pointer-events:none;
}

/* Like / commentaire en bas de la nouvelle */
.reader-actions{
  top:auto !important;
  bottom:max(24px, env(safe-area-inset-bottom)) !important;
  gap:18px !important;
  right:max(22px, calc((100vw - 430px)/2 + 22px)) !important;
  flex-direction:column;
}

/* Les infos de la carte disparaissent à l'intérieur de la carte,
   pas en faisant bouger les éléments extérieurs. */
.story-card.expanding .read-more-single,
.story-card.expanded .read-more-single,
.story-card.collapsing .read-more-single,
.story-card.expanding .card-meta-single,
.story-card.expanded .card-meta-single,
.story-card.collapsing .card-meta-single,
.story-card.expanding .compact-fade,
.story-card.expanded .compact-fade,
.story-card.collapsing .compact-fade{
  opacity:0;
  transform:none !important;
}


.reader-overlay.closing .reader-backdrop{
  opacity:0 !important;
}
.reader-overlay.closing .reader-actions{
  opacity:0 !important;
  transition:opacity .18s ease !important;
}


/* V5.4 — le voile gris est une couche indépendante qui se dissipe pendant la fermeture */
.reader-overlay{
  background:transparent !important;
}
.reader-backdrop{
  background:#e6e6e6 !important;
  pointer-events:auto;
}


/* V5.5 — progression de lecture réellement visible */
.read-progress-track{
  position:absolute !important;
  left:24px !important;
  right:24px !important;
  bottom:14px !important;
  height:3px !important;
  border-radius:999px;
  background:rgba(0,0,0,.10) !important;
  z-index:245 !important;
  opacity:0 !important;
  overflow:hidden;
  pointer-events:none;
}
.story-card.expanded .read-progress-track{
  opacity:1 !important;
}
.read-progress-bar{
  width:0%;
  height:100%;
  border-radius:999px;
  background:#000 !important;
}

/* Les actions restent juste au-dessus de la barre */
.reader-actions{
  bottom:max(34px, calc(env(safe-area-inset-bottom) + 18px)) !important;
}


.comments-section{
  display:none;
  margin-top:54px;
  padding-top:28px;
  border-top:1px solid rgba(0,0,0,.10);
}
.story-card.expanded .comments-section{
  display:block;
}
.comments-section h3{
  margin:0 0 18px;
  font-size:18px;
  font-weight:700;
}
.comment-item{
  padding:14px 0;
  border-bottom:1px solid rgba(0,0,0,.08);
}
.comment-head{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  margin-bottom:7px;
}
.comment-head strong{
  font-size:13px;
}
.comment-head time{
  font-size:10px;
  color:#888;
  white-space:nowrap;
}
.comment-body{
  font-size:14px;
  line-height:1.35;
  margin:0 0 9px;
}
.reply-btn{
  border:0;
  background:transparent;
  padding:0;
  font-size:11px;
  font-weight:700;
  cursor:pointer;
}
.replies{
  margin-left:18px;
  padding-left:12px;
  border-left:2px solid #eee;
}
.reply-form{
  display:none;
  margin-top:9px;
}
.reply-form.open{
  display:flex;
  gap:7px;
}
.reply-form input{
  flex:1;
  min-width:0;
  border:1px solid #ddd;
  border-radius:999px;
  padding:9px 12px;
  font:inherit;
  font-size:12px;
}
.reply-form button{
  border:0;
  border-radius:999px;
  background:#000;
  color:#fff;
  padding:0 12px;
  font-size:11px;
  font-weight:700;
}
.no-comments{
  color:#888;
  font-size:13px;
  padding:4px 0 8px;
}


.library-row-wrap{
  display:grid;
  grid-template-columns:1fr 38px;
  align-items:center;
  gap:8px;
}
.library-row-main{
  width:100%;
}

  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#e8e8e8;
  display:grid;
  place-items:center;
  font-size:21px;
  line-height:1;
  cursor:pointer;
}
.library-remove:active{
  transform:scale(.94);
}


/* V5.7 — fermeture des écrans secondaires par glissement vers le bas */
.modal.closing{
  opacity:0;
}
.modal.closing .modal-panel{
  transform:translateY(100%) !important;
}
.modal-panel{
  transition:transform .34s cubic-bezier(.2,.82,.2,1);
}

  transition:opacity .24s ease;
}

/* Pas de bouton croix de fermeture : clic hors panneau uniquement */
.close-btn{
  display:none !important;
}


/* V5.8 — suppression intégrée dans le bandeau de bibliothèque */
.library-row-wrap{
  position:relative;
  display:block !important;
}

.library-row-main{
  width:100%;
  padding-right:54px !important;
}

.library-remove{
  position:absolute !important;

  height:32px !important;

  border-radius:50%;

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CHUT.E — interface Tinder + Supabase
   ========================================================= */

const SUPABASE_URL = "https://sebmujwmtnqmwpqlyqlj.supabase.co";
const SUPABASE_KEY = "sb_publishable_eG-3HAKL08CfD3lS8wNE8A_nK8Vvikc";
const ADMIN_EMAIL = "ydevin17@gmail.com";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let STORIES = [];
let current = 0;
let drag = null;
let suppressClick = false;
let storyReturnTarget = "home";
let pendingLibraryRemoval = null;
let editingStoryId = null;
let commentsSupportReplies = true;

const deck = document.getElementById("deck");
const card = document.getElementById("storyCard");
const saveCue = document.getElementById("saveCue");
const prevCue = document.getElementById("prevCue");
const nextCue = document.getElementById("nextCue");
const countEl = document.getElementById("libraryCount");
const reader = document.getElementById("readerOverlay");
const readerBackdrop = document.getElementById("readerBackdrop");
const likeBtn = document.getElementById("likeBtn");
const searchInputEl = document.getElementById("searchInput");

const savedIds = new Set(JSON.parse(localStorage.getItem("chute_library_ids") || "[]").map(String));
let likedIds = new Set();
let likeCounts = new Map();

function escapeHTML(v){
  const d = document.createElement("div");
  d.textContent = v ?? "";
  return d.innerHTML;
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function countWords(text){ return (String(text || "").match(/\S+/g) || []).length; }
function estimateMinutes(words){ return Math.max(1, Math.ceil(words / 220)); }
function visitorId(){
  let id = localStorage.getItem("chute_visitor_id");
  if(!id){
    id = crypto.randomUUID ? crypto.randomUUID() : "v-"+Date.now()+"-"+Math.random().toString(36).slice(2);
    localStorage.setItem("chute_visitor_id", id);
  }
  return id;
}
function normalizeSearchText(value){
  return String(value ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .replace(/[’']/g," ")
    .replace(/[^a-z0-9\s-]/g," ")
    .replace(/\s+/g," ")
    .trim();
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;
  t.classList.add("show");
  clearTimeout(window.__toast);
  window.__toast=setTimeout(()=>t.classList.remove("show"),1500);
}
function storyById(id){ return STORIES.find(s => String(s.id) === String(id)); }
function currentStory(){ return STORIES[current] || null; }
function getDisplayedLikes(storyOrIndex){
  const s = typeof storyOrIndex === "number" ? STORIES[storyOrIndex] : storyOrIndex;
  if(!s) return 0;
  return likeCounts.get(String(s.id)) || 0;
}
function updateCount(){ countEl.textContent=savedIds.size; }

function mapStory(row){
  const text = row.content || "";
  const words = countWords(text);
  return {
    id:String(row.id),
    date:row.publication_date,
    title:row.title || "Sans titre",
    text,
    published:!!row.published,
    body:text.split(/\n\s*\n/).filter(Boolean),
    words,
    minutes:estimateMinutes(words)
  };
}
function publicStories(rows){
  const today=todayISO();
  return rows
    .filter(s => s.published && (!s.date || s.date <= today))
    .sort((a,b)=>(b.date||"").localeCompare(a.date||""));
}

async function loadStories(preferredId=null){
  const {data,error}=await sb
    .from("stories")
    .select("id,title,content,publication_date,published")
    .order("publication_date",{ascending:false});

  if(error){
    console.error(error);
    toast("Impossible de charger les nouvelles");
    STORIES=[];
    renderCard(false);
    return false;
  }

  const mapped=(data||[]).map(mapStory);
  STORIES=publicStories(mapped);

  if(preferredId){
    const idx=STORIES.findIndex(s=>String(s.id)===String(preferredId));
    if(idx>=0) current=idx;
  }
  if(current >= STORIES.length) current=0;

  await loadLikeSummaries();
  renderCard(false);
  renderLibrary();
  renderSearchResults(searchInputEl?.value || "");
  return true;
}

async function loadLikeSummaries(){
  likeCounts = new Map();
  likedIds = new Set();

  const [allRes,mineRes] = await Promise.all([
    sb.from("likes").select("story_id"),
    sb.from("likes").select("story_id").eq("visitor_id",visitorId())
  ]);

  if(!allRes.error){
    for(const row of (allRes.data||[])){
      const id=String(row.story_id);
      likeCounts.set(id,(likeCounts.get(id)||0)+1);
    }
  } else console.error(allRes.error);

  if(!mineRes.error){
    for(const row of (mineRes.data||[])) likedIds.add(String(row.story_id));
  } else console.error(mineRes.error);
}

function storyCardHTML(s){
  if(!s){
    return `<div class="card-content"><h1 class="card-title">Aucune nouvelle</h1><div class="preview">Aucune nouvelle publiée pour le moment.</div></div>`;
  }
  return `
    <div class="expanded-fade-top"></div>

    <div class="story-scroll-single" id="storyScrollSingle">
      <h1 class="story-title-single">${escapeHTML(s.title)}</h1>

      <div class="story-body-single">
        <div id="storyTextOnly">
          ${s.body.map(p=>`<p>${escapeHTML(p).replace(/\n/g,"<br>")}</p>`).join("")}
        </div>

        <section class="comments-section" id="commentsSection">
          <h3>Commentaires</h3>
          <div id="commentsList"></div>
        </section>
      </div>
    </div>

    <div class="compact-fade"></div>
    <button class="read-more-single" id="readMore">(Lire plus)</button>

    <div class="card-meta-single">
      <span>♡ <b id="cardLikes">${getDisplayedLikes(s)}</b></span>
      <span>${s.words} mots</span>
      <span>${s.minutes} min</span>
    </div>

    <div class="expanded-fade-bottom"></div>
    <div class="read-progress-track" aria-hidden="true">
      <div class="read-progress-bar" id="readProgressBar"></div>
    </div>
  `;
}

function renderCard(animate=true){
  const s=currentStory();
  card.innerHTML=storyCardHTML(s);

  if(animate){
    card.style.opacity="0";
    card.style.transform="translate3d(0,18px,0) scale(.96)";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      card.style.opacity="1";
      card.style.transform="translate3d(0,0,0) scale(1)";
    }));
  }

  const more=document.getElementById("readMore");
  if(more){
    more.addEventListener("click",e=>{
      e.stopPropagation();
      storyReturnTarget="home";
      openReader();
    });
  }

  bindExpandedScroll();
  updateLikeButton();
}

function updateLikeButton(){
  const s=currentStory();
  if(!s) return;
  const id=String(s.id);
  likeBtn.classList.toggle("liked",likedIds.has(id));
  const n=document.getElementById("cardLikes");
  if(n) n.textContent=String(getDisplayedLikes(s));
}

async function toggleLike(){
  const s=currentStory();
  if(!s) return;
  const id=String(s.id);
  const vid=visitorId();
  let error=null;

  if(likedIds.has(id)){
    ({error}=await sb.from("likes").delete().eq("story_id",Number(id)).eq("visitor_id",vid));
  } else {
    ({error}=await sb.from("likes").insert({story_id:Number(id),visitor_id:vid}));
  }
  if(error){
    console.error(error);
    toast("Impossible d’enregistrer le like");
    return;
  }

  await loadLikeSummaries();
  updateLikeButton();
  renderLibrary();
  renderSearchResults(searchInputEl?.value || "");
}

function saveCurrent(){
  const s=currentStory();
  if(!s) return;
  const id=String(s.id);
  const wasNew=!savedIds.has(id);
  savedIds.add(id);
  localStorage.setItem("chute_library_ids",JSON.stringify([...savedIds]));
  updateCount();
  if(wasNew){
    countEl.animate([{transform:"scale(1)"},{transform:"scale(1.22)"},{transform:"scale(1)"}],{duration:350,easing:"ease-out"});
    toast("Ajoutée à Ma bibliothèque");
  } else {
    toast("Déjà dans Ma bibliothèque");
  }
}

function bindExpandedScroll(){
  const sc=card.querySelector("#storyScrollSingle");
  if(!sc) return;
  const progress=card.querySelector("#readProgressBar");

  function updateProgress(){
    if(!progress) return;
    const storyOnly=card.querySelector("#storyTextOnly");
    if(!storyOnly){ progress.style.width="0%"; return; }
    const storyEnd=storyOnly.offsetTop+storyOnly.offsetHeight;
    const viewportBottom=sc.scrollTop+sc.clientHeight;
    const start=storyOnly.offsetTop;
    const distance=Math.max(1,storyEnd-start);
    const progressed=Math.max(0,viewportBottom-start);
    progress.style.width=Math.max(0,Math.min(100,(progressed/distance)*100))+"%";
  }
  sc.addEventListener("scroll",updateProgress,{passive:true});
  updateProgress();

  let pull=null;
  sc.addEventListener("pointerdown",e=>{
    if(card.classList.contains("expanded") && sc.scrollTop<=2){
      pull={y:e.clientY,dy:0};
      sc.setPointerCapture?.(e.pointerId);
    }
  });
  sc.addEventListener("pointermove",e=>{
    if(!pull || !card.classList.contains("expanded")) return;
    const dy=e.clientY-pull.y;
    if(dy<=0)return;
    pull.dy=dy;
    if(dy>8){
      card.style.transition="none";
      card.style.transform=`translateY(${Math.min(34,dy*.22)}px) scale(${1-Math.min(.014,dy/8000)})`;
    }
  });
  const finish=()=>{
    if(!pull)return;
    const dy=pull.dy;
    pull=null;
    if(dy>76){
      card.style.transform="none";
      closeReader();
    }else{
      card.style.transition="transform .22s ease";
      card.style.transform="none";
    }
  };
  sc.addEventListener("pointerup",finish);
  sc.addEventListener("pointercancel",finish);
}

async function openReader(index=current){
  if(index!==current){
    current=index;
    renderCard(false);
  }
  const s=currentStory();
  if(!s)return;

  const start=card.getBoundingClientRect();
  const appRect=document.getElementById("app").getBoundingClientRect();
  const targetTop=Math.max(154,appRect.top+154);
  const targetLeft=appRect.left;
  const targetWidth=appRect.width;
  const targetHeight=window.innerHeight-targetTop;

  document.body.appendChild(card);
  card.classList.add("expanding");
  card.style.transition="none";
  card.style.left=start.left+"px";
  card.style.top=start.top+"px";
  card.style.width=start.width+"px";
  card.style.height=start.height+"px";
  card.style.borderRadius="31px";
  card.style.transform="none";
  card.style.opacity="1";

  document.getElementById("app").classList.add("reading");
  reader.classList.remove("closing");
  reader.classList.add("open");

  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    card.style.transition=
      "left .42s cubic-bezier(.2,.82,.2,1),"+
      "top .42s cubic-bezier(.2,.82,.2,1),"+
      "width .42s cubic-bezier(.2,.82,.2,1),"+
      "height .42s cubic-bezier(.2,.82,.2,1),"+
      "border-radius .42s ease";
    card.style.left=targetLeft+"px";
    card.style.top=targetTop+"px";
    card.style.width=targetWidth+"px";
    card.style.height=targetHeight+"px";
    card.style.borderRadius="30px 30px 0 0";

    setTimeout(()=>{
      card.classList.remove("expanding");
      card.classList.add("expanded");
      const sc=card.querySelector("#storyScrollSingle");
      if(sc){
        sc.scrollTop=0;
        const p=card.querySelector("#readProgressBar");
        if(p)p.style.width="0%";
      }
    },420);
  }));

  await renderCommentsForCurrent();
  updateLikeButton();
}

function closeReader(){
  if(!card.classList.contains("expanded") && !card.classList.contains("expanding"))return;

  const deckRect=deck.getBoundingClientRect();
  const destW=260;
  const destH=448;
  const destLeft=deckRect.left+(deckRect.width-destW)/2;
  const destTop=deckRect.top+(deckRect.height-destH)/2;

  card.classList.remove("expanded","expanding");
  card.classList.add("collapsing");
  reader.classList.add("closing");

  card.style.transition=
    "left .40s cubic-bezier(.2,.82,.2,1),"+
    "top .40s cubic-bezier(.2,.82,.2,1),"+
    "width .40s cubic-bezier(.2,.82,.2,1),"+
    "height .40s cubic-bezier(.2,.82,.2,1),"+
    "border-radius .40s ease";
  card.style.left=destLeft+"px";
  card.style.top=destTop+"px";
  card.style.width=destW+"px";
  card.style.height=destH+"px";
  card.style.borderRadius="31px";

  setTimeout(()=>{
    deck.appendChild(card);
    card.classList.remove("collapsing");
    card.removeAttribute("style");
    reader.classList.remove("open","closing");
    document.getElementById("app").classList.remove("reading");

    if(storyReturnTarget==="library"){
      const lib=document.getElementById("libraryModal");
      lib.style.visibility="";
      lib.classList.add("open");
    } else if(storyReturnTarget==="search"){
      const modal=document.getElementById("searchModal");
      modal.style.visibility="";
      modal.classList.remove("open","closing");
      void modal.offsetHeight;
      requestAnimationFrame(()=>modal.classList.add("open"));
    }
    storyReturnTarget="home";
  },405);
}

/* -------------------- SWIPE -------------------- */
function moveTo(nextIndex,direction){
  if(!STORIES.length)return;
  card.classList.remove("dragging");
  card.style.transition="transform .30s cubic-bezier(.2,.8,.2,1),opacity .24s ease";
  card.style.transform=`translate3d(${direction*125}%,0,0) rotate(${direction*9}deg)`;
  card.style.opacity="0";

  document.getElementById("backLeft").style.transform=
    direction<0 ? "translate(0px,0px) rotate(0deg) scale(1.01)" : "translate(-38px,10px) rotate(-11deg)";
  document.getElementById("backRight").style.transform=
    direction>0 ? "translate(0px,0px) rotate(0deg) scale(1.01)" : "translate(38px,28px) rotate(10deg)";

  setTimeout(()=>{
    current=(nextIndex+STORIES.length)%STORIES.length;
    card.style.transition="none";
    card.style.opacity="0";
    card.style.transform=`translate3d(${-direction*38}px,10px,0) rotate(${-direction*3}deg) scale(.97)`;
    document.getElementById("backLeft").style.transform="translate(-25px,7px) rotate(-8deg)";
    document.getElementById("backRight").style.transform="translate(25px,28px) rotate(7deg)";
    renderCard(false);
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      card.style.transition="transform .35s cubic-bezier(.2,.82,.2,1),opacity .25s ease";
      card.style.opacity="1";
      card.style.transform="translate3d(0,0,0) rotate(0) scale(1)";
    }));
  },245);
}

card.addEventListener("pointerdown",e=>{
  if(card.classList.contains("expanded")||card.classList.contains("expanding")||card.classList.contains("collapsing"))return;
  if(e.target.closest("button"))return;
  drag={x:e.clientX,y:e.clientY,dx:0,dy:0,moved:false};
  card.setPointerCapture?.(e.pointerId);
  card.classList.add("dragging");
});
card.addEventListener("pointermove",e=>{
  if(!drag)return;
  drag.dx=e.clientX-drag.x;
  drag.dy=e.clientY-drag.y;
  if(Math.hypot(drag.dx,drag.dy)>7)drag.moved=true;
  const ax=Math.abs(drag.dx),ay=Math.abs(drag.dy);

  if(ax>ay){
    card.style.transform=`translate3d(${drag.dx}px,${drag.dy*.12}px,0) rotate(${drag.dx*.035}deg)`;
    prevCue.style.opacity=drag.dx>18?Math.min(.9,drag.dx/100):0;
    nextCue.style.opacity=drag.dx<-18?Math.min(.9,-drag.dx/100):0;
    saveCue.style.opacity=0;
  }else if(drag.dy>0){
    card.style.transform=`translate3d(0,${drag.dy*.55}px,0) scale(${Math.min(1.055,1+drag.dy/1800)})`;
    saveCue.style.opacity=Math.min(1,drag.dy/80);
    prevCue.style.opacity=nextCue.style.opacity=0;
  }
});
function resetCues(){
  saveCue.style.opacity=0;
  prevCue.style.opacity=0;
  nextCue.style.opacity=0;
}
function endDrag(){
  if(!drag)return;
  const d=drag; drag=null;
  card.classList.remove("dragging");
  suppressClick=d.moved;
  setTimeout(()=>suppressClick=false,50);

  const ax=Math.abs(d.dx),ay=Math.abs(d.dy);
  if(ax>ay && d.dx<-78){ resetCues(); moveTo(current+1,-1); return; }
  if(ax>ay && d.dx>78){ resetCues(); moveTo(current-1,1); return; }
  if(ay>ax && d.dy>72){
    saveCurrent();
    card.style.transition="transform .22s cubic-bezier(.2,.9,.2,1)";
    card.style.transform="translate3d(0,22px,0) scale(1.055)";
    setTimeout(()=>card.style.transform="translate3d(0,0,0) scale(1)",160);
    resetCues(); return;
  }
  card.style.transition="transform .28s cubic-bezier(.2,.82,.2,1)";
  card.style.transform="translate3d(0,0,0) rotate(0) scale(1)";
  resetCues();
}
card.addEventListener("pointerup",endDrag);
card.addEventListener("pointercancel",endDrag);
card.addEventListener("click",e=>{
  if(card.classList.contains("expanded")||card.classList.contains("expanding")||card.classList.contains("collapsing"))return;
  if(suppressClick||e.target.closest("button"))return;
  storyReturnTarget="home";
  openReader();
});

/* -------------------- COMMENTS -------------------- */
function commentDate(iso){
  return new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}).format(new Date(iso));
}
async function fetchComments(storyId){
  let res=await sb
    .from("comments")
    .select("id,author,content,created_at,parent_id")
    .eq("story_id",Number(storyId))
    .order("created_at",{ascending:false});

  if(res.error){
    commentsSupportReplies=false;
    res=await sb
      .from("comments")
      .select("id,author,content,created_at")
      .eq("story_id",Number(storyId))
      .order("created_at",{ascending:false});
  } else commentsSupportReplies=true;

  if(res.error){
    console.error(res.error);
    return [];
  }
  return res.data||[];
}
async function renderCommentsForCurrent(){
  const s=currentStory();
  const list=document.getElementById("commentsList");
  if(!s||!list)return;
  list.innerHTML=`<div class="no-comments">Chargement…</div>`;
  const rows=await fetchComments(s.id);

  const parents=commentsSupportReplies ? rows.filter(r=>!r.parent_id) : rows;
  const replies=commentsSupportReplies ? rows.filter(r=>r.parent_id) : [];

  if(!parents.length){
    list.innerHTML=`<div class="no-comments">Aucun commentaire pour le moment.</div>`;
    return;
  }

  list.innerHTML=parents.map(c=>{
    const child=replies.filter(r=>String(r.parent_id)===String(c.id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    return `
      <article class="comment-item" data-comment-id="${c.id}">
        <div class="comment-head"><strong>${escapeHTML(c.author||"Anonyme")}</strong><time>${commentDate(c.created_at)}</time></div>
        <p class="comment-body">${escapeHTML(c.content)}</p>
        ${commentsSupportReplies?`<button class="reply-btn" data-reply="${c.id}">Répondre</button>`:""}
        <div class="replies">${child.map(r=>`
          <div class="comment-item">
            <div class="comment-head"><strong>${escapeHTML(r.author||"Anonyme")}</strong><time>${commentDate(r.created_at)}</time></div>
            <p class="comment-body">${escapeHTML(r.content)}</p>
          </div>`).join("")}
        </div>
        ${commentsSupportReplies?`
        <div class="reply-form" id="reply-${c.id}">
          <input type="text" placeholder="Votre réponse">
          <button data-send-reply="${c.id}">Envoyer</button>
        </div>`:""}
      </article>`;
  }).join("");

  list.querySelectorAll("[data-reply]").forEach(btn=>btn.addEventListener("click",()=>{
    document.getElementById("reply-"+btn.dataset.reply)?.classList.toggle("open");
  }));
  list.querySelectorAll("[data-send-reply]").forEach(btn=>btn.addEventListener("click",async()=>{
    const form=document.getElementById("reply-"+btn.dataset.sendReply);
    const input=form?.querySelector("input");
    const value=input?.value.trim();
    if(!value)return;
    const author=localStorage.getItem("chute_comment_name")||"Auteur";
    const {error}=await sb.from("comments").insert({
      story_id:Number(currentStory().id),
      author,
      content:value,
      parent_id:Number(btn.dataset.sendReply)
    });
    if(error){ console.error(error); toast("Réponse non publiée"); return; }
    await renderCommentsForCurrent();
    toast("Réponse ajoutée");
  }));
}

document.getElementById("commentBtn").addEventListener("click",()=>{
  document.getElementById("commentModal").classList.add("open");
});
document.getElementById("sendComment").addEventListener("click",async()=>{
  const s=currentStory();
  if(!s)return;
  const author=(document.getElementById("commentAuthor").value||"").trim();
  const content=(document.getElementById("commentText").value||"").trim();
  if(!author||!content){ toast("Indique un nom et un commentaire"); return; }

  localStorage.setItem("chute_comment_name",author);
  const {error}=await sb.from("comments").insert({story_id:Number(s.id),author,content});
  if(error){ console.error(error); toast("Commentaire non publié"); return; }

  document.getElementById("commentText").value="";
  closeModalAnimated("commentModal");
  await renderCommentsForCurrent();

  const sc=card.querySelector("#storyScrollSingle");
  if(sc)requestAnimationFrame(()=>sc.scrollTo({top:sc.scrollHeight,behavior:"smooth"}));
  toast("Commentaire publié");
});

/* -------------------- LIBRARY -------------------- */
function renderLibrary(){
  const list=document.getElementById("libraryList");
  if(!list)return;
  const items=[...savedIds].map(storyById).filter(Boolean);

  if(!items.length){
    list.innerHTML=`<div class="empty">Aucune nouvelle dans Ma bibliothèque.</div>`;
    return;
  }
  list.innerHTML=items.map(s=>{
    const idx=STORIES.findIndex(x=>String(x.id)===String(s.id));
    return `<div class="library-row-wrap">
      <button class="lib-row library-row-main" data-story-id="${s.id}">
        <strong>${escapeHTML(s.title)}</strong>
        <small>♡ ${getDisplayedLikes(s)} · ${s.words} mots · ${s.minutes} min</small>
      </button>
      <button class="library-remove" data-remove-library="${s.id}" aria-label="Retirer de la bibliothèque">×</button>
    </div>`;
  }).join("");

  list.querySelectorAll(".library-row-main").forEach(btn=>btn.addEventListener("click",()=>{
    const idx=STORIES.findIndex(s=>String(s.id)===String(btn.dataset.storyId));
    if(idx<0)return;
    storyReturnTarget="library";
    const lib=document.getElementById("libraryModal");
    lib.style.visibility="hidden";
    openReader(idx);
  }));

  list.querySelectorAll("[data-remove-library]").forEach(btn=>btn.addEventListener("click",e=>{
    e.stopPropagation();
    pendingLibraryRemoval=String(btn.dataset.removeLibrary);
    const s=storyById(pendingLibraryRemoval);
    document.getElementById("removeLibraryText").textContent=`« ${s?.title||"Cette nouvelle"} » sera retirée de Ma bibliothèque.`;
    document.getElementById("removeLibraryModal").classList.add("open");
  }));
}
document.getElementById("libraryBtn").addEventListener("click",()=>{
  renderLibrary();
  document.getElementById("libraryModal").classList.add("open");
});
document.getElementById("cancelRemoveLibrary").addEventListener("click",()=>{
  pendingLibraryRemoval=null;
  closeModalAnimated("removeLibraryModal");
});
document.getElementById("confirmRemoveLibrary").addEventListener("click",()=>{
  if(pendingLibraryRemoval===null)return;
  savedIds.delete(String(pendingLibraryRemoval));
  localStorage.setItem("chute_library_ids",JSON.stringify([...savedIds]));
  pendingLibraryRemoval=null;
  updateCount();
  renderLibrary();
  closeModalAnimated("removeLibraryModal",()=>toast("Retirée de Ma bibliothèque"));
});

/* -------------------- SEARCH -------------------- */
function renderSearchResults(query){
  const box=document.getElementById("searchResults");
  if(!box)return;
  const q=normalizeSearchText(query);

  if(!q){
    box.innerHTML=`<div class="search-empty">Commence à taper un mot.</div>`;
    return;
  }
  const terms=q.split(" ").filter(Boolean);
  const matches=STORIES.filter(s=>{
    const hay=normalizeSearchText(s.title+" "+s.text);
    return terms.every(term=>hay.includes(term));
  });

  if(!matches.length){
    box.innerHTML=`<div class="search-empty">Aucune nouvelle trouvée.</div>`;
    return;
  }

  box.innerHTML=matches.map(s=>`
    <button class="search-result" type="button" data-search-id="${s.id}">
      <strong>${escapeHTML(s.title)}</strong>
      <small>♡ ${getDisplayedLikes(s)} · ${s.words} mots · ${s.minutes} min</small>
    </button>`).join("");

  box.querySelectorAll("[data-search-id]").forEach(btn=>btn.addEventListener("click",()=>{
    const idx=STORIES.findIndex(s=>String(s.id)===String(btn.dataset.searchId));
    if(idx<0)return;
    storyReturnTarget="search";
    const modal=document.getElementById("searchModal");
    modal.classList.remove("open","closing");
    modal.style.visibility="";
    openReader(idx);
  }));
}
document.getElementById("searchBtn").addEventListener("click",()=>{
  const modal=document.getElementById("searchModal");
  modal.style.visibility="";
  modal.classList.add("open");
  renderSearchResults(searchInputEl.value);
  setTimeout(()=>searchInputEl.focus(),180);
});
searchInputEl.addEventListener("input",()=>renderSearchResults(searchInputEl.value));
searchInputEl.addEventListener("search",()=>renderSearchResults(searchInputEl.value));

/* -------------------- MODALS -------------------- */
function closeModalAnimated(modalOrId,callback){
  const modal=typeof modalOrId==="string"?document.getElementById(modalOrId):modalOrId;
  if(!modal||!modal.classList.contains("open")){ if(callback)callback(); return; }
  modal.classList.add("closing");
  setTimeout(()=>{
    modal.classList.remove("open","closing");
    if(callback)callback();
  },330);
}
document.querySelectorAll(".modal").forEach(m=>m.addEventListener("click",e=>{
  if(e.target===m)closeModalAnimated(m);
}));

/* -------------------- ADMIN / AUTH -------------------- */
async function ensureAdmin(){
  const {data}=await sb.auth.getSession();
  if(data.session)return true;

  const password=prompt("Mot de passe Auteur");
  if(password===null)return false;
  const {error}=await sb.auth.signInWithPassword({email:ADMIN_EMAIL,password});
  if(error){
    console.error(error);
    toast("Mot de passe incorrect");
    return false;
  }
  toast("Connecté");
  return true;
}
async function openAdmin(){
  if(!await ensureAdmin())return;
  document.getElementById("adminModal").classList.add("open");
}
async function loadAllStoriesAdmin(){
  const {data,error}=await sb
    .from("stories")
    .select("id,title,content,publication_date,published")
    .order("publication_date",{ascending:false});
  if(error){ console.error(error); toast("Chargement impossible"); return []; }
  return (data||[]).map(mapStory);
}
async function renderAdminStories(){
  const box=document.getElementById("adminStoriesList");
  const all=await loadAllStoriesAdmin();
  box.innerHTML=all.map(s=>`
    <button class="lib-row" data-edit-story="${s.id}">
      <strong>${escapeHTML(s.title)}</strong>
      <small>${s.date||""} · ${s.words} mots · ${s.minutes} min</small>
    </button>`).join("") || `<div class="empty">Aucune nouvelle.</div>`;

  box.querySelectorAll("[data-edit-story]").forEach(btn=>btn.addEventListener("click",async()=>{
    const all=await loadAllStoriesAdmin();
    const s=all.find(x=>String(x.id)===String(btn.dataset.editStory));
    if(!s)return;
    editingStoryId=String(s.id);
    document.getElementById("adminStoryTitle").textContent="Modifier la nouvelle";
    document.getElementById("adminDateInput").value=s.date||todayISO();
    document.getElementById("adminTitleInput").value=s.title;
    document.getElementById("adminBodyInput").value=s.text;
    closeModalAnimated("adminStoriesModal",()=>document.getElementById("adminStoryModal").classList.add("open"));
  }));
}
async function renderAdminComments(){
  const box=document.getElementById("adminCommentsList");
  let res=await sb.from("comments").select("id,story_id,author,content,created_at,parent_id").order("created_at",{ascending:false});
  if(res.error){
    res=await sb.from("comments").select("id,story_id,author,content,created_at").order("created_at",{ascending:false});
  }
  if(res.error){ console.error(res.error); box.innerHTML=`<div class="empty">Chargement impossible.</div>`; return; }

  box.innerHTML=(res.data||[]).map(c=>{
    const s=storyById(c.story_id);
    return `<div class="lib-row">
      <strong>${escapeHTML(s?.title||"Nouvelle")}</strong>
      <small>${escapeHTML(c.author||"Anonyme")} · ${commentDate(c.created_at)}</small>
      <div style="font-size:13px;margin:8px 0 10px">${escapeHTML(c.content)}</div>
      <button data-delete-comment="${c.id}" style="border:0;border-radius:999px;padding:7px 10px;background:#000;color:#fff;font-size:11px">Supprimer</button>
    </div>`;
  }).join("") || `<div class="empty">Aucun commentaire.</div>`;

  box.querySelectorAll("[data-delete-comment]").forEach(btn=>btn.addEventListener("click",async()=>{
    if(!confirm("Supprimer ce commentaire ?"))return;
    const {error}=await sb.from("comments").delete().eq("id",Number(btn.dataset.deleteComment));
    if(error){ console.error(error); toast("Suppression impossible"); return; }
    await renderAdminComments();
    if(card.classList.contains("expanded"))await renderCommentsForCurrent();
    toast("Commentaire supprimé");
  }));
}

document.getElementById("adminAddStory").addEventListener("click",()=>{
  editingStoryId=null;
  document.getElementById("adminStoryTitle").textContent="Ajouter une nouvelle";
  document.getElementById("adminDateInput").value=todayISO();
  document.getElementById("adminTitleInput").value="";
  document.getElementById("adminBodyInput").value="";
  closeModalAnimated("adminModal",()=>document.getElementById("adminStoryModal").classList.add("open"));
});
document.getElementById("adminEditStories").addEventListener("click",async()=>{
  await renderAdminStories();
  closeModalAnimated("adminModal",()=>document.getElementById("adminStoriesModal").classList.add("open"));
});
document.getElementById("adminManageComments").addEventListener("click",async()=>{
  await renderAdminComments();
  closeModalAnimated("adminModal",()=>document.getElementById("adminCommentsModal").classList.add("open"));
});
document.getElementById("adminLogout").addEventListener("click",async()=>{
  await sb.auth.signOut();
  closeModalAnimated("adminModal");
  toast("Déconnecté");
});
document.getElementById("adminSaveStory").addEventListener("click",async()=>{
  const date=document.getElementById("adminDateInput").value||todayISO();
  const title=document.getElementById("adminTitleInput").value.trim();
  const content=document.getElementById("adminBodyInput").value.trim();
  if(!title||!content){ toast("Complète le titre et le texte"); return; }

  let error=null, savedId=editingStoryId;
  if(editingStoryId){
    ({error}=await sb.from("stories")
      .update({title,content,publication_date:date,published:true})
      .eq("id",Number(editingStoryId)));
  } else {
    const res=await sb.from("stories")
      .insert({title,content,publication_date:date,published:true})
      .select("id").single();
    error=res.error;
    if(res.data)savedId=String(res.data.id);
  }
  if(error){ console.error(error); toast("Enregistrement impossible"); return; }

  closeModalAnimated("adminStoryModal");
  editingStoryId=null;
  await loadStories(savedId);
  toast("Enregistré");
});

/* double tap caché sur chut.e ! */
let brandTapCount=0,brandTapTimer=null;
document.getElementById("brand").addEventListener("click",e=>{
  e.preventDefault();e.stopPropagation();
  brandTapCount++;
  clearTimeout(brandTapTimer);
  if(brandTapCount>=2){
    brandTapCount=0;
    openAdmin();
  }else{
    brandTapTimer=setTimeout(()=>brandTapCount=0,520);
  }
});
document.getElementById("brand").addEventListener("dblclick",e=>{
  e.preventDefault();e.stopPropagation();
  brandTapCount=0;
  openAdmin();
});

/* -------------------- BUTTONS -------------------- */
document.getElementById("shuffleBtn").addEventListener("click",()=>{
  if(STORIES.length<2)return;
  let n=current;
  while(n===current)n=Math.floor(Math.random()*STORIES.length);
  moveTo(n,-1);
});
likeBtn.addEventListener("click",toggleLike);
readerBackdrop.addEventListener("click",()=>{

});
