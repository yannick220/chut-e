<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>CHUT.E</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#fff;
  --ink:#0c0c0d;
  --muted:#8d8d92;
  --line:#ececef;
  --soft:#f7f7f8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff;color:var(--ink)}
body,button,input,textarea{
  font-family:"Montserrat",sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{cursor:pointer}
.app{
  width:min(100%,430px);
  min-height:100vh;
  margin:0 auto;
  background:#fff;
  position:relative;
}
.top{
  height:58px;
  padding:calc(8px + env(safe-area-inset-top)) 18px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.logo{font-size:16px;font-weight:700;letter-spacing:.01em}
.top-actions{display:flex;gap:2px}
.icon{
  width:38px;height:38px;border:0;background:transparent;border-radius:50%;
  display:grid;place-items:center;color:#111
}
.icon:active{background:var(--soft)}
.icon svg{width:20px;height:20px}

.main{padding:30px 22px 106px}
.date{
  font-size:11px;
  font-weight:500;
  color:var(--muted);
  margin-bottom:20px;
  text-transform:capitalize
}
.title{
  font-size:33px;
  line-height:1.05;
  letter-spacing:-.045em;
  margin:0;
  font-weight:700;
}
.text{
  margin-top:30px;
  font-size:18px;
  font-weight:400;
  line-height:1.68;
  letter-spacing:-.015em;
}
.text p{
  margin:0 0 .78em;
}
.text p:last-child{
  margin-bottom:0;
}
.meta{
  margin-top:24px;
  padding-top:14px;
  border-top:1px solid var(--line);
  font-size:11px;
  color:var(--muted);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
}

.bottom{
  position:fixed;
  left:50%;transform:translateX(-50%);
  bottom:0;
  width:min(100%,430px);
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:5;
}
.tab{
  border:0;background:none;color:var(--muted);
  padding:6px 2px 4px;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:9px;font-weight:600
}
.tab svg{width:20px;height:20px}
.tab.active{color:#111}

/* Panneau coulissant */
.sheet{
  position:fixed;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
  background:rgba(0,0,0,0);
  z-index:10;
  pointer-events:none;
  transition:background .32s ease;
}
.sheet.open{
  background:rgba(0,0,0,.14);
  pointer-events:auto;
}
.panel{
  width:min(100%,430px);
  max-height:86vh;
  overflow:auto;
  background:#fff;
  border-radius:24px 24px 0 0;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(104%);
  transition:transform .38s cubic-bezier(.22,.8,.24,1);
  will-change:transform;
}
.sheet.open .panel{transform:translateY(0)}
.handle{width:36px;height:4px;border-radius:99px;background:#d7d7db;margin:0 auto 18px}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.panel h2{margin:0;font-size:25px;font-weight:700;letter-spacing:-.035em}
.close{border:0;background:var(--soft);width:32px;height:32px;border-radius:50%;font-size:20px}

.searchbar{
  display:flex;align-items:center;gap:9px;
  background:var(--soft);
  border-radius:13px;
  padding:10px 12px;
  margin:2px 0 16px
}
.searchbar svg{width:18px;height:18px;color:var(--muted);flex:none}
.searchbar input{
  border:0;background:transparent;outline:none;width:100%;
  font-size:14px;padding:0
}

.item{padding:16px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item button{border:0;background:none;padding:0;width:100%;text-align:left}
.item .d{font-size:10px;color:var(--muted);margin-bottom:5px}
.item .t{font-size:17px;font-weight:700;letter-spacing:-.025em}
.item .p{font-size:12px;line-height:1.5;color:var(--muted);margin-top:6px}

.admin label{
  display:block;font-size:10px;font-weight:600;color:var(--muted);
  margin:14px 0 6px;text-transform:uppercase;letter-spacing:.04em
}
.admin input,.admin textarea{
  width:100%;border:1px solid #dedee3;border-radius:12px;background:#fff;
  padding:12px 13px;outline:none;font-size:14px
}
.admin textarea{min-height:220px;resize:vertical;line-height:1.6}
.primary,.secondary{
  width:100%;border:0;border-radius:12px;padding:13px 15px;font-weight:700
}
.primary{margin-top:14px;background:#111;color:#fff}
.secondary{margin-top:8px;background:var(--soft);color:#111}
.note{font-size:11px;color:var(--muted);line-height:1.5}
.link{border:0;background:none;padding:0;color:#111;font-weight:600;font-size:12px}

.toast{
  position:fixed;left:50%;bottom:88px;transform:translate(-50%,8px);
  background:#111;color:white;border-radius:999px;padding:9px 13px;
  font-size:11px;opacity:0;transition:.2s;z-index:20
}
.toast.show{opacity:1;transform:translate(-50%,0)}



.story-actions{
  display:flex;
  align-items:center;
  gap:5px;
  flex:none;
}
.like-button{
  border:0;
  background:transparent;
  padding:2px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  color:#111;
}
.like-button svg{
  width:19px;
  height:19px;
}
.like-button.liked svg{
  fill:#111;
}
.like-count{
  color:var(--muted);
  font-size:10px;
  font-weight:500;
  min-width:8px;
}
.like-count{
  color:var(--muted);
  font-size:10px;
  font-weight:500;
}

.comments{
  margin-top:18px;
  padding-top:18px;
  border-top:1px solid var(--line);
}
.comments-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px;
}
.comments-title{
  font-size:14px;
  font-weight:700;
  letter-spacing:-.02em;
}
.comments-count{
  font-size:10px;
  color:var(--muted);
}
.comment-form{
  display:grid;
  gap:8px;
  margin-bottom:14px;
}
.comment-form input,
.comment-form textarea{
  width:100%;
  border:1px solid #dedee3;
  border-radius:12px;
  padding:11px 12px;
  outline:none;
  background:#fff;
  font-size:13px;
}
.comment-form textarea{
  min-height:88px;
  resize:vertical;
  line-height:1.5;
}
.comment-submit{
  justify-self:end;
  border:0;
  background:#111;
  color:#fff;
  border-radius:999px;
  padding:9px 13px;
  font-size:11px;
  font-weight:700;
}
.comment{
  padding:14px 0;
  border-top:1px solid var(--line);
}
.comment:first-child{border-top:0}
.comment-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:baseline;
  margin-bottom:5px;
}
.comment-author{
  font-size:12px;
  font-weight:700;
}
.comment-date{
  font-size:9px;
  color:var(--muted);
}
.comment-text{
  font-size:12px;
  line-height:1.55;
  color:#333;
  white-space:pre-wrap;
}
.comments-empty{
  font-size:11px;
  color:var(--muted);
  padding:4px 0 2px;
}

@media(min-width:700px){
  body{background:#f4f4f5;padding:24px 0}
  .app{min-height:calc(100vh - 48px);box-shadow:0 20px 60px rgba(0,0,0,.07)}
  .bottom{bottom:24px}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo">CHUT.E</div>
    <div class="top-actions">
      <button class="icon" aria-label="Au hasard" onclick="showRandom()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="m4 4 5 5"/>
        </svg>
      </button>

      <button class="icon" aria-label="Partager" onclick="shareCurrent()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="2.2"/>
          <circle cx="6" cy="12" r="2.2"/>
          <circle cx="18" cy="19" r="2.2"/>
          <path d="M8 11l8-5"/>
          <path d="M8 13l8 5"/>
        </svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="date" id="date"></div>
    <h1 class="title" id="title"></h1>
    <div class="text" id="text"></div>
    <div class="meta">
      <span id="meta"></span>
      <div class="story-actions">
        <button class="like-button" id="likeButton" onclick="toggleLike()" aria-label="J’aime cette histoire">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>
          </svg>
        </button>
        <span class="like-count" id="likeCount"></span>
      </div>
    </div>
    <section class="comments">
      <div class="comments-head">
        <div class="comments-title">Commentaires</div>
        <div class="comments-count" id="commentsCount"></div>
      </div>
      <div class="comment-form">
        <input id="commentName" maxlength="40" placeholder="Votre prénom ou pseudo">
        <textarea id="commentText" maxlength="600" placeholder="Laisser un commentaire…"></textarea>
        <button class="comment-submit" onclick="addComment()">Publier</button>
      </div>
      <div id="commentsList"></div>
    </section>
  </main>

  <nav class="bottom">
    <button class="tab active" onclick="showToday(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="5" width="16" height="15" rx="2"/>
        <path d="M8 3v4M16 3v4M4 9h16"/>
        <circle cx="12" cy="14" r="2.2"/>
      </svg>
      Aujourd'hui
    </button>

    <button class="tab" onclick="openArchive(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 5h14v14H5z"/><path d="M8 9h8M8 13h8"/></svg>
      Archives
    </button>

    <button class="tab" onclick="openAdmin(this)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="3"/><path d="M6 19c.8-3.4 2.8-5 6-5s5.2 1.6 6 5"/></svg>
      Auteur
    </button>
  </nav>
</div>

<div class="sheet" id="sheet" onclick="backdrop(event)">
  <div class="panel">
    <div class="handle"></div>
    <div class="panel-head">
      <h2 id="sheetTitle"></h2>
      <button class="close" onclick="closeSheet()">×</button>
    </div>
    <div id="sheetContent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://sebmujwmtnqmwpqlyqlj.supabase.co";
const SUPABASE_KEY="sb_publishable_eG-3HAKL08CfD3lS8wNE8A_nK8Vvikc";
const ADMIN_EMAIL="ydevin17@gmail.com";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const seed=[
{id:"demo-1",date:"2026-08-13",title:"La dernière rame",text:"Le métro ferma ses portes devant lui.\n\nDe l’autre côté de la vitre, elle souriait encore. Il leva la main. Elle aussi.\n\nPuis la rame disparut dans le tunnel.\n\nIl resta seul sur le quai, avec cette pensée absurde : après quarante-deux ans de mariage, ils venaient enfin de réussir leurs adieux.",published:true,persisted:false},
{id:"demo-2",date:"2026-08-12",title:"Le message",text:"À 23 h 58, son téléphone vibra.\n\n« Tu dors ? »\n\nIl regarda le prénom, hésita, puis retourna l’appareil sur la table.\n\nLe lendemain matin, il apprit qu’elle était morte à minuit.\n\nDepuis, il répond à tout le monde.",published:true,persisted:false},
{id:"demo-3",date:"2026-08-11",title:"La place vide",text:"Tous les dimanches, il dressait deux couverts.\n\nLa voisine avait fini par lui demander pourquoi.\n\nIl avait souri.\n\n— Parce qu’un jour elle reviendra.\n\nLa voisine n’avait pas osé lui rappeler qu’elle habitait désormais l’appartement d’en face.",published:true,persisted:false}
];

let stories=[];
let current=null;
let editing=null;
let adminSession=false;
let likeState={count:0,liked:false};
const $=id=>document.getElementById(id);

function mapStory(row){
  return {
    id:String(row.id),
    date:row.publication_date,
    title:row.title,
    text:row.content,
    published:row.published,
    persisted:true
  };
}

function todayISO(){return new Date().toISOString().slice(0,10)}
function pubs(){
  const today=todayISO();
  return stories
    .filter(s=>s.published && s.date<=today)
    .sort((a,b)=>b.date.localeCompare(a.date));
}
function today(){
  const p=pubs();
  return p.find(s=>s.date===todayISO())||p[0]||stories[0]||null;
}
function fdate(d){
  return new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"})
    .format(new Date(d+"T12:00:00"));
}
function words(t){return (t.match(/\S+/g)||[]).length}

async function loadStories(preferredId=null){
  const {data,error}=await sb
    .from("stories")
    .select("id,title,content,publication_date,published")
    .order("publication_date",{ascending:false});

  if(error){
    console.error(error);
    if(!stories.length) stories=seed.slice();
    show(current||today());
    return false;
  }

  stories=(data||[]).map(mapStory);
  if(!stories.length) stories=seed.slice();

  let next=preferredId ? stories.find(s=>String(s.id)===String(preferredId)) : null;
  if(!next && current) next=stories.find(s=>String(s.id)===String(current.id));
  show(next||today());
  return true;
}

function show(s){
  if(!s){
    $("date").textContent="";
    $("title").textContent="Aucune histoire";
    $("text").innerHTML="<p>La prochaine micro-fiction apparaîtra ici.</p>";
    $("meta").textContent="";
    $("commentsCount").textContent="";
    $("commentsList").innerHTML="";
    return;
  }
  current=s;
  $("date").textContent=fdate(s.date);
  $("title").textContent=s.title;
  $("text").innerHTML=s.text
    .split(/\n\s*\n/)
    .map(p=>`<p>${escapeHtml(p).replace(/\n/g,"<br>")}</p>`)
    .join("");
  $("meta").textContent=`${words(s.text)} mots · ${Math.max(1,Math.ceil(words(s.text)/220))} min`;
  renderComments();
  renderLike();
}

function visitorId(){
  let id=localStorage.getItem("chute_visitor_id");
  if(!id){
    id=crypto.randomUUID ? crypto.randomUUID() : "v-"+Date.now()+"-"+Math.random().toString(36).slice(2);
    localStorage.setItem("chute_visitor_id",id);
  }
  return id;
}

async function renderLike(){
  if(!current || !current.persisted){
    likeState={count:0,liked:false};
    $("likeButton").classList.remove("liked");
    $("likeCount").textContent="";
    return;
  }

  const vid=visitorId();
  const [countRes,mineRes]=await Promise.all([
    sb.from("likes").select("id",{count:"exact",head:true}).eq("story_id",Number(current.id)),
    sb.from("likes").select("id").eq("story_id",Number(current.id)).eq("visitor_id",vid).maybeSingle()
  ]);

  if(countRes.error) console.error(countRes.error);
  if(mineRes.error) console.error(mineRes.error);

  likeState={
    count:countRes.count||0,
    liked:!!mineRes.data
  };
  $("likeButton").classList.toggle("liked",likeState.liked);
  $("likeCount").textContent=likeState.count ? String(likeState.count) : "";
}

async function toggleLike(){
  if(!current)return;
  if(!current.persisted){
    toast("Connecte-toi une première fois en Auteur");
    return;
  }

  const vid=visitorId();
  let error;

  if(likeState.liked){
    ({error}=await sb
      .from("likes")
      .delete()
      .eq("story_id",Number(current.id))
      .eq("visitor_id",vid));
  }else{
    ({error}=await sb
      .from("likes")
      .insert({story_id:Number(current.id),visitor_id:vid}));
  }

  if(error){
    console.error(error);
    toast("Impossible d’enregistrer le vote");
    return;
  }
  await renderLike();
}

function commentDate(iso){
  return new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})
    .format(new Date(iso));
}

async function renderComments(){
  if(!current)return;
  if(!current.persisted){
    $("commentsCount").textContent="";
    $("commentsList").innerHTML=`<div class="comments-empty">Les commentaires seront disponibles après la première connexion Auteur.</div>`;
    return;
  }

  $("commentsList").innerHTML=`<div class="comments-empty">Chargement…</div>`;
  const {data,error}=await sb
    .from("comments")
    .select("id,author,content,created_at")
    .eq("story_id",Number(current.id))
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);
    $("commentsList").innerHTML=`<div class="comments-empty">Impossible de charger les commentaires.</div>`;
    return;
  }

  const list=data||[];
  $("commentsCount").textContent=list.length ? `${list.length} ${list.length>1?"commentaires":"commentaire"}` : "";
  $("commentsList").innerHTML=list.length
    ? list.map(c=>`
      <div class="comment">
        <div class="comment-top">
          <div class="comment-author">${escapeHtml(c.author)}</div>
          <div class="comment-date">${commentDate(c.created_at)}</div>
        </div>
        <div class="comment-text">${escapeHtml(c.content)}</div>
      </div>`).join("")
    : `<div class="comments-empty">Soyez le premier à commenter.</div>`;
}

async function addComment(){
  if(!current)return;
  if(!current.persisted){
    toast("Connecte-toi une première fois en Auteur");
    return;
  }

  const name=($("commentName").value||"").trim();
  const text=($("commentText").value||"").trim();
  if(!name||!text){toast("Indique un nom et un commentaire");return}

  const {error}=await sb.from("comments").insert({
    story_id:Number(current.id),
    author:name,
    content:text
  });

  if(error){
    console.error(error);
    toast("Commentaire non publié");
    return;
  }

  $("commentText").value="";
  await renderComments();
  toast("Commentaire publié");
}

function active(b){
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  if(b)b.classList.add("active");
}

function showToday(b){active(b);closeSheet(false);show(today())}
function showRandom(){
  const p=pubs();
  if(p.length)show(p[Math.floor(Math.random()*p.length)]);
}

function openSheet(title,content){
  $("sheetTitle").textContent=title;
  $("sheetContent").innerHTML=content;
  requestAnimationFrame(()=>$("sheet").classList.add("open"));
}

function openArchive(b){
  if(b)active(b);
  openSheet("Archives",`
    <div class="searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 5 5"/>
      </svg>
      <input id="archiveSearch" type="search" placeholder="Rechercher une histoire" oninput="renderArchive(this.value)">
    </div>
    <div id="archiveResults"></div>
  `);
  renderArchive("");
}

function renderArchive(q){
  const query=(q||"").trim().toLowerCase();
  const list=query
    ? pubs().filter(s=>(s.title+" "+s.text).toLowerCase().includes(query))
    : pubs();

  $("archiveResults").innerHTML=list.length
    ? list.map(s=>`
      <div class="item">
        <button onclick="selectStory('${s.id}')">
          <div class="d">${fdate(s.date)}</div>
          <div class="t">${escapeHtml(s.title)}</div>
          <div class="p">${escapeHtml(s.text.replace(/\n/g," ").slice(0,105))}${s.text.length>105?"…":""}</div>
        </button>
      </div>`).join("")
    : `<p class="note">Aucun résultat.</p>`;
}

function selectStory(id){
  show(stories.find(s=>String(s.id)===String(id)));
  closeSheet();
}

async function openAdmin(b){
  if(b)active(b);

  const {data}=await sb.auth.getSession();
  if(data.session){
    adminSession=true;
    await ensureInitialStories();
    admin();
    return;
  }

  openSheet("Auteur",`
    <div class="admin">
      <label>Mot de passe</label>
      <input id="pw" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
      <button class="primary" onclick="login()">Continuer</button>
      <p class="note">Accès réservé à l’auteur.</p>
    </div>`);
}

async function login(){
  const password=($("pw").value||"").trim();
  if(!password){toast("Entre ton mot de passe");return}

  const {error}=await sb.auth.signInWithPassword({
    email:ADMIN_EMAIL,
    password
  });

  if(error){
    console.error(error);
    toast("Mot de passe incorrect");
    return;
  }

  adminSession=true;
  await ensureInitialStories();
  await loadStories();
  admin();
  toast("Connecté");
}

async function ensureInitialStories(){
  const {data,error}=await sb.from("stories").select("id").limit(1);
  if(error){
    console.error(error);
    return;
  }
  if(data && data.length)return;

  const payload=seed.map(s=>({
    title:s.title,
    content:s.text,
    publication_date:s.date,
    published:true
  }));

  const {error:insertError}=await sb.from("stories").insert(payload);
  if(insertError) console.error(insertError);
}

function admin(){
  editing=null;
  $("sheetTitle").textContent="Administration";
  $("sheetContent").innerHTML=`<div class="admin">
    <label>Date</label><input id="fd" type="date" value="${todayISO()}">
    <label>Titre</label><input id="ft">
    <label>Micro-fiction</label><textarea id="fx"></textarea>
    <button class="primary" onclick="saveStory()">Publier</button>
    <button class="secondary" onclick="logoutAdmin()">Se déconnecter</button>
    <p class="note">Une date future programme automatiquement la publication.</p>
    <div style="height:1px;background:var(--line);margin:22px 0 8px"></div>
    <div style="font-size:13px;font-weight:700;margin:0 0 4px">Publications</div>
    <div id="adminPublications"></div>
  </div>`;
  renderAdminPublications();
}

async function saveStory(){
  const date=$("fd").value;
  const title=$("ft").value.trim();
  const text=$("fx").value.trim();
  if(!date||!title||!text){toast("Complète les trois champs");return}

  let error;
  let savedId=editing;

  if(editing){
    ({error}=await sb
      .from("stories")
      .update({title,content:text,publication_date:date,published:true})
      .eq("id",Number(editing)));
  }else{
    const result=await sb
      .from("stories")
      .insert({title,content:text,publication_date:date,published:true})
      .select("id")
      .single();
    error=result.error;
    if(result.data)savedId=String(result.data.id);
  }

  if(error){
    console.error(error);
    toast("Enregistrement impossible");
    return;
  }

  const wasEditing=!!editing;
  editing=null;
  await loadStories(savedId);
  admin();
  toast(wasEditing?"Modifications enregistrées":"Publié");
}

function renderAdminPublications(){
  const box=$("adminPublications");
  if(!box)return;

  box.innerHTML=stories
    .filter(s=>s.persisted)
    .slice()
    .sort((a,b)=>b.date.localeCompare(a.date))
    .map(s=>`
      <div class="item">
        <div class="d">${fdate(s.date)}</div>
        <div class="t">${escapeHtml(s.title)}</div>
        <div style="display:flex;gap:12px;margin-top:10px">
          <button class="secondary" style="width:auto;margin:0;padding:8px 11px" onclick="edit('${s.id}')">Modifier</button>
          <button class="secondary" style="width:auto;margin:0;padding:8px 11px" onclick="del('${s.id}')">Supprimer</button>
        </div>
      </div>`).join("") || `<p class="note">Aucune publication.</p>`;
}

function edit(id){
  const s=stories.find(x=>String(x.id)===String(id));
  if(!s)return;
  editing=String(id);
  $("sheetTitle").textContent="Modifier";
  $("sheetContent").innerHTML=`<div class="admin">
    <label>Date</label><input id="fd" type="date" value="${s.date}">
    <label>Titre</label><input id="ft" value="${escapeAttr(s.title)}">
    <label>Micro-fiction</label><textarea id="fx">${escapeHtml(s.text)}</textarea>
    <button class="primary" onclick="saveStory()">Enregistrer les modifications</button>
    <button class="secondary" onclick="admin()">Annuler</button>
  </div>`;
}

async function del(id){
  if(!confirm("Supprimer cette histoire ?"))return;

  const {error}=await sb.from("stories").delete().eq("id",Number(id));
  if(error){
    console.error(error);
    toast("Suppression impossible");
    return;
  }

  await loadStories();
  admin();
  toast("Nouvelle supprimée");
}

async function logoutAdmin(){
  await sb.auth.signOut();
  adminSession=false;
  closeSheet();
  toast("Déconnecté");
}

function closeSheet(resetTab=true){
  $("sheet").classList.remove("open");
  setTimeout(()=>{
    if(resetTab){
      document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
      document.querySelector(".tab").classList.add("active");
    }
  },260);
}

function backdrop(e){if(e.target.id==="sheet")closeSheet()}
function toast(t){
  $("toast").textContent=t;
  $("toast").classList.add("show");
  setTimeout(()=>$("toast").classList.remove("show"),1700);
}
function escapeHtml(v){
  const d=document.createElement("div");
  d.textContent=v||"";
  return d.innerHTML;
}
function escapeAttr(v){return escapeHtml(v).replace(/"/g,"&quot;")}

async function shareCurrent(){
  if(!current)return;
  if(navigator.share){
    await navigator.share({title:current.title,text:current.text,url:location.href});
  }else{
    navigator.clipboard?.writeText(location.href);
    toast("Lien copié");
  }
}

async function init(){
  await loadStories();
}
init();
</script>
</body>
</html>
